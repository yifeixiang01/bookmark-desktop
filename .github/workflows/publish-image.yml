name: 构建并发布部署镜像

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize publishing and deployment so an older build cannot replace a newer one.
concurrency:
  group: production-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 获取源代码
        uses: actions/checkout@v4

      - name: 准备镜像名称
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并发布镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=production-image
          cache-to: type=gha,mode=max,scope=production-image

      - name: 记录镜像版本
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "镜像：\`$IMAGE_NAME:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "回滚版本：\`$IMAGE_NAME:sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "摘要：\`$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      # Configure only AFTER Dokploy has been switched to the image source.
      - name: 触发 Dokploy 部署（配置后启用）
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        shell: bash
        run: |
          if [ -z "$DEPLOY_WEBHOOK" ]; then
            echo "镜像已发布；未配置 Dokploy 部署 Webhook，请在 Dokploy 手动部署。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$DEPLOY_WEBHOOK" in
            https://*) ;;
            *) echo "部署 Webhook 必须使用 HTTPS" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 15 --max-time 60 \
            --request POST "$DEPLOY_WEBHOOK"
          echo "已请求 Dokploy 部署；实际部署结果请查看 Dokploy 日志。" >> "$GITHUB_STEP_SUMMARY"
